<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Chatbot Preview</title>
  <style>html,body{margin:0;width:100%;height:100%;background:#faf8f5;overflow:hidden}</style>
</head>
<body>
<script>
(function(){
  const businessId = new URLSearchParams(location.search).get('businessId');
  if (!businessId) return;
  const s = document.createElement('script');
  s.src = location.origin + '/widget.js';
  s.setAttribute('data-business-id', businessId);
  document.body.appendChild(s);
})();
</script>
</body>
</html>
