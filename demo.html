<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Demo — Client Website with AI Widget</title>
<link rel="stylesheet" href="style.css" />
<style>
  body { background: #fff; }
  .hero { padding: 80px 28px; text-align: center; }
  .hero h1 { font-size: 32px; }
  .hero p { color: var(--gray); max-width: 480px; margin: 10px auto 0; }
  .note { max-width: 520px; margin: 0 auto 40px; }
</style>
</head>
<body>
  <div class="hero">
    <h1 id="business-name">Green Acres Realty</h1>
    <p>This is a mock client website. The orange chat bubble bottom-right is your embedded AI Automation widget — try it.</p>
  </div>
  <div class="note card">
    <p class="sub" style="margin-bottom:6px">Demo business:</p>
    <p style="font-size:14px; color:var(--gray)">The chatbot loads the business selected in the URL. If no business ID is supplied, the built-in <code>green-acres-realty</code> demo is used.</p>
  </div>

  <script>
    const params = new URLSearchParams(location.search);
    const requestedBusiness = (params.get('business') || '').trim();
    const businessId = requestedBusiness || 'green-acres-realty';
    const resolvedBusinessId = /^business$/i.test(businessId) ? 'green-acres-realty' : businessId;
    const widget = document.createElement('script');
    widget.src = '/voice-widget.js?v=1';
    widget.dataset.businessId = resolvedBusinessId;
    document.body.appendChild(widget);
  </script>
</body>
</html>
